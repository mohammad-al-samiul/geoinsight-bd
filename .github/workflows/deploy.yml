# GeoInsight BD — CI/CD: test → build → push GHCR → deploy VPS
#
# Triggers on merge/push to `main`.
#
# Required GitHub Secrets:
#   VPS_HOST          — Public IP or hostname of Ubuntu VPS
#   VPS_USER          — SSH user (e.g. deploy)
#   VPS_SSH_KEY       — Private key (PEM) for VPS_USER
#   GHCR_PAT          — PAT with read:packages (VPS docker pull); write:packages uses GITHUB_TOKEN
#
# Optional Secrets:
#   VPS_SSH_PORT      — Default 22
#   VPS_DEPLOY_PATH   — Default /opt/geoinsight-bd
#
# Required GitHub Variables (Repository → Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_API_URL       — e.g. https://geoinsight.gov.bd/api/v1
#   NEXT_PUBLIC_SOCKET_URL    — e.g. https://geoinsight.gov.bd

name: Deploy Production (GHCR)

on:
  # Manual only — automatic VPS updates use deploy-vps.yml (git pull + compose build)
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GHCR_OWNER: ${{ github.repository_owner }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/geoinsight-bd' }}

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Test jobs (parallel)
  # ---------------------------------------------------------------------------
  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/api-gateway-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run integration tests
        run: npm test

      - name: Typecheck build
        run: npm run build

  test-ai-analytics:
    name: Test AI Analytics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-analytics-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-analytics-python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -q

  test-dashboard:
    name: Test Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard-nextjs
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api/v1' }}
      NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:4000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/dashboard-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Build & push Docker images to GHCR (after tests pass)
  # ---------------------------------------------------------------------------
  build-api-gateway:
    name: Build & Push API Gateway
    runs-on: ubuntu-latest
    needs: test-api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/geoinsight-api-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: services/api-gateway-node
          file: services/api-gateway-node/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ai-analytics:
    name: Build & Push AI Analytics
    runs-on: ubuntu-latest
    needs: test-ai-analytics
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/geoinsight-ai-analytics
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: services/ai-analytics-python
          file: services/ai-analytics-python/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dashboard:
    name: Build & Push Dashboard
    runs-on: ubuntu-latest
    needs: test-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/geoinsight-dashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v6
        with:
          context: web/dashboard-nextjs
          file: web/dashboard-nextjs/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Ubuntu VPS via SSH
  # ---------------------------------------------------------------------------
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - build-api-gateway
      - build-ai-analytics
      - build-dashboard
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose & deploy assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_SSH_PORT }}
          source: "docker-compose.prod.yml,deploy/"
          target: ${{ env.VPS_DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_PATH: ${{ env.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_SSH_PORT }}
          envs: IMAGE_TAG,GHCR_OWNER,GHCR_PAT,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH:-/opt/geoinsight-bd}"
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_PATH/.env missing — create from .env.example before first deploy"
              exit 1
            fi

            echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            export IMAGE_TAG
            export GHCR_OWNER

            docker compose -f docker-compose.prod.yml pull \
              api-gateway ai-analytics dashboard-nextjs

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for API gateway health..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api-gateway \
                wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1; then
                echo "API gateway healthy"
                break
              fi
              sleep 5
            done

            docker image prune -af --filter "until=72h"
            docker builder prune -af --filter "until=72h" || true

            docker compose -f docker-compose.prod.yml ps
