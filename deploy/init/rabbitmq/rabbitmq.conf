## GeoInsight BD — RabbitMQ broker configuration
## Imported once on first boot; topology is also re-applied by minio-init-style job if needed.

load_definitions = /etc/rabbitmq/definitions/definitions.json

# Prometheus metrics (enabled via enabled_plugins)
prometheus.return_per_object_metrics = true

# Classic queues for gov / AI workloads
default_vhost = /
default_user_tags.administrator = true
