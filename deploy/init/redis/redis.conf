# GeoInsight BD — Redis 7 production config (caching + pub/sub)

bind 0.0.0.0
port 6379
protected-mode yes

# Set via command line: --requirepass ${REDIS_PASSWORD}
# appendonly no — cache/pub-sub workload; enable AOF for session durability if required

maxmemory 512mb
maxmemory-policy volatile-lru

tcp-keepalive 300
timeout 0

# Pub/Sub + Socket.io adapter throughput
client-output-buffer-limit pubsub 64mb 32mb 60

save ""

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
