; GeoInsight BD — PgBouncer transaction pooling (50k+ client connections)
; Mount with userlist.txt; apps connect on :6432

[databases]
geoinsight_write = host=postgres port=5432 dbname=geoinsight_db
geoinsight_read  = host=postgres-replica port=5432 dbname=geoinsight_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /tmp/userlist.txt

pool_mode = transaction
max_client_conn = 50000
default_pool_size = 120
min_pool_size = 10
reserve_pool_size = 25
reserve_pool_timeout = 3
max_db_connections = 200
max_user_connections = 200

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,search_path,application_name

admin_users = geoinsight_admin
stats_users = geoinsight_admin

log_connections = 0
log_disconnections = 0
stats_period = 60
