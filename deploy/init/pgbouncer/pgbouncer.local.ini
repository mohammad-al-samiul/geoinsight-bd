; Local dev — read pool falls back to primary when replica is not running
[databases]
geoinsight_write = host=postgres port=5432 dbname=geoinsight_db
geoinsight_read  = host=postgres port=5432 dbname=geoinsight_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /tmp/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 40
min_pool_size = 5
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,search_path,application_name
admin_users = geoinsight_admin
