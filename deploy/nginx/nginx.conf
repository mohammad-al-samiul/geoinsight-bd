# GeoInsight BD — Edge reverse proxy (Tier-4 NDC)
# Terminates TLS, injects security headers, enforces DDoS rate limits.
#
# Mount: /etc/nginx/nginx.conf
# Upstreams expect docker-compose service names on geoinsight_net.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging (no PII in access logs; Tier-4 audit trail) ---
    log_format sovereign '$remote_addr - $request_id [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'rt=$request_time u="$http_user_agent"';
    access_log /var/log/nginx/access.log sovereign buffer=64k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    server_tokens   off;
    client_max_body_size 2m;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 15s;

    # --- Compression (faster page loads over WAN) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Short proxy cache for relatively stable API JSON (keyed by full URI + cookie hash)
    proxy_cache_path /var/cache/nginx/geoinsight levels=1:2 keys_zone=gi_api:20m
                     max_size=64m inactive=5m use_temp_path=off;

    # --- DDoS / abuse rate-limit zones ---
    # General API traffic (authenticated dashboard)
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_health:5m rate=10r/s;

    # Public 333 (Upazila) / 999 (Union) sentiment data feeds — strict
    limit_req_zone $binary_remote_addr zone=feed_333:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=feed_999:10m rate=15r/m;
    limit_req_zone $binary_remote_addr zone=feed_burst:10m rate=5r/s;

    # Connection flood protection
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # --- Security headers (applied via map + add_header) ---
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
        "~*text/html" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
    }

    upstream dashboard_upstream {
        server dashboard-nextjs:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream api_gateway_upstream {
        server api-gateway:4000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream ai_analytics_upstream {
        server ai-analytics:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Redirect cleartext → TLS (HSTS enforced on 443 server)
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name geoinsight.gov.bd *.geoinsight.gov.bd;

        # TLS (mount real NDC-issued certs in production)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # --- Mandatory security headers ---
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp_header always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        limit_conn conn_per_ip 40;

        # Request ID for sovereign audit correlation
        add_header X-Request-Id $request_id always;

        # --- Public 333 Upazila data feed (AI sentiment stream) ---
        location = /api/v1/public/feeds/333/stream {
            limit_req zone=feed_burst burst=10 nodelay;
            limit_req zone=feed_333 burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://ai_analytics_upstream/api/v1/sentiment/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # --- Public 999 Union data feed (stricter) ---
        location = /api/v1/public/feeds/999/stream {
            limit_req zone=feed_burst burst=5 nodelay;
            limit_req zone=feed_999 burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://ai_analytics_upstream/api/v1/sentiment/stream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # --- AI sentiment (direct path — same limits) ---
        location /api/v1/sentiment/ {
            limit_req zone=feed_333 burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://ai_analytics_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # --- API Gateway (authenticated REST + WebSocket) ---
        location /api/v1/ {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /socket.io/ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # --- Auth endpoints (credential stuffing protection) ---
        location ~ ^/api/v1/auth/(login|refresh) {
            limit_req zone=api_auth burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://api_gateway_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location = /api/v1/health {
            limit_req zone=api_health burst=20 nodelay;
            proxy_pass http://api_gateway_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Next.js static assets (immutable hashed files) ---
        location /_next/static/ {
            proxy_pass http://dashboard_upstream;
            include /etc/nginx/proxy_params.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            expires 1y;
        }

        # --- Next.js dashboard (default) ---
        location / {
            limit_req zone=api_general burst=100 nodelay;
            proxy_pass http://dashboard_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        # Block common probe paths
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
