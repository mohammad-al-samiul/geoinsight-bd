# GeoInsight BD — Alertmanager routing & receivers
# Edit receiver addresses before production; reload via SIGUP or container restart.

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.gov.bd:587"
  smtp_from: "sre-alerts@geoinsight.gov.bd"
  smtp_require_tls: true

route:
  receiver: geoinsight-default
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: geoinsight-critical
      repeat_interval: 1h
      continue: true
    - matchers:
        - team = ledger
      receiver: geoinsight-ledger
    - matchers:
        - team = ml-platform
      receiver: geoinsight-ml

receivers:
  - name: geoinsight-default
    email_configs:
      - to: "sre@geoinsight.gov.bd"
        send_resolved: true
        headers:
          Subject: "[GeoInsight BD] {{ .Status | toUpper }} — {{ .CommonLabels.alertname }}"

  - name: geoinsight-critical
    email_configs:
      - to: "oncall@geoinsight.gov.bd"
        send_resolved: true
    slack_configs:
      - api_url: "https://hooks.slack.com/services/REPLACE/ME"
        channel: "#geoinsight-incidents"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"

  - name: geoinsight-ledger
    email_configs:
      - to: "ledger-ops@geoinsight.gov.bd"
        send_resolved: true

  - name: geoinsight-ml
    email_configs:
      - to: "ml-ops@geoinsight.gov.bd"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["alertname", "service"]
