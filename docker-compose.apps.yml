# GeoInsight BD — Application services overlay (local Docker full stack)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml logs -f api-gateway dashboard-nextjs

services:
  db-init:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: geoinsight-db-init
    restart: "no"
    logging:
      driver: json-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB:-geoinsight_db}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - ./deploy/scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/docker-db-init.sh"]
    networks:
      - geoinsight_net

  api-gateway:
    build:
      context: ./services/api-gateway-node
      dockerfile: Dockerfile
    image: geoinsight/api-gateway:local
    container_name: geoinsight-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/geoinsight_write?schema=public&pgbouncer=true&connection_limit=10
      DATABASE_READ_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/geoinsight_read?schema=public&pgbouncer=true&connection_limit=20
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoinsight_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-geoinsight_exchange}
      RABBITMQ_GOV_QUEUE: ${RABBITMQ_GOV_QUEUE:-gov_core_queue}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-analytics:8000
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      db-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoinsight_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  ai-analytics:
    build:
      context: ./services/ai-analytics-python
      dockerfile: Dockerfile
    image: geoinsight/ai-analytics:local
    container_name: geoinsight-ai-analytics
    restart: unless-stopped
    # Internal only (ai-analytics:8000) — no host bind avoids Windows Hyper-V port exclusions on 8000
    environment:
      NODE_ENV: production
      AI_CORE_PORT: 8000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-geoinsight_exchange}
      RABBITMQ_AI_QUEUE: ${RABBITMQ_AI_QUEUE:-ai_analytics_queue}
      SENTIMENT_USE_MOCK: ${SENTIMENT_USE_MOCK:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      SOVEREIGN_MODE: ${SOVEREIGN_MODE:-true}
      AI_MODEL_CACHE_DIR: /tmp/ml_models/cache
      CORS_ORIGINS: ${CORS_ORIGIN:-http://localhost:3000},http://api-gateway:4000
      HF_HUB_DISABLE_TELEMETRY: "1"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoinsight_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/v1/health'')"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  dashboard-nextjs:
    build:
      context: ./web/dashboard-nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_GATEWAY_PORT:-4000}/api/v1
        NEXT_PUBLIC_SOCKET_URL: http://localhost:${API_GATEWAY_PORT:-4000}
    image: geoinsight/dashboard:local
    container_name: geoinsight-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      API_GATEWAY_URL: http://api-gateway:4000
      COOKIE_SECURE: "false"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - geoinsight_net
