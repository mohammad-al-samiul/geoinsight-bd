# GeoInsight BD — Application services overlay (local Docker full stack)
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml logs -f api-gateway dashboard-nextjs

services:
  # Apply Prisma schema BEFORE seeding (fixes fresh-VPS db-init exit 3)
  db-migrate:
    build:
      context: ./services/api-gateway-node
      dockerfile: Dockerfile
    image: geoinsight/api-gateway:local
    container_name: geoinsight-db-migrate
    restart: "no"
    logging:
      driver: json-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoinsight_db}?schema=public
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoinsight_db}?schema=public
      TZ: ${TZ:-Asia/Dhaka}
    entrypoint: ["sh", "-c"]
    command:
      - DATABASE_URL="$$DIRECT_DATABASE_URL" npx prisma migrate deploy
    networks:
      - geoinsight_net

  db-init:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: geoinsight-db-init
    restart: "no"
    logging:
      driver: json-file
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB:-geoinsight_db}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - ./deploy/scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/docker-db-init.sh"]
    networks:
      - geoinsight_net

  api-gateway:
    build:
      context: ./services/api-gateway-node
      dockerfile: Dockerfile
    image: geoinsight/api-gateway:local
    container_name: geoinsight-api-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${API_GATEWAY_PORT:-4800}:4000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/geoinsight_write?schema=public&pgbouncer=true&connection_limit=10
      DATABASE_READ_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/geoinsight_read?schema=public&pgbouncer=true&connection_limit=20
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geoinsight_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-geoinsight_exchange}
      RABBITMQ_GOV_QUEUE: ${RABBITMQ_GOV_QUEUE:-gov_core_queue}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3600}
      AI_SERVICE_URL: http://ai-analytics:8000
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_INTERVAL_MS: ${INGESTION_INTERVAL_MS:-900000}
      INGESTION_RUN_ON_START: ${INGESTION_RUN_ON_START:-false}
      INGESTION_STARTUP_DELAY_MS: ${INGESTION_STARTUP_DELAY_MS:-120000}
      PIPELINE_ENABLED: ${PIPELINE_ENABLED:-true}
      PIPELINE_RUN_ON_START: ${PIPELINE_RUN_ON_START:-false}
      PIPELINE_STARTUP_DELAY_MS: ${PIPELINE_STARTUP_DELAY_MS:-180000}
      PIPELINE_NEWS_INTERVAL_MS: ${PIPELINE_NEWS_INTERVAL_MS:-900000}
      PIPELINE_COMMODITY_INTERVAL_MS: ${PIPELINE_COMMODITY_INTERVAL_MS:-1800000}
      PIPELINE_KPI_INTERVAL_MS: ${PIPELINE_KPI_INTERVAL_MS:-1800000}
      PIPELINE_ALERT_INTERVAL_MS: ${PIPELINE_ALERT_INTERVAL_MS:-1200000}
      PIPELINE_AGRO_INTERVAL_MS: ${PIPELINE_AGRO_INTERVAL_MS:-1800000}
      PIPELINE_HAZARD_INTERVAL_MS: ${PIPELINE_HAZARD_INTERVAL_MS:-1800000}
      LIVE_DATA_ONLY: ${LIVE_DATA_ONLY:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-500}
    depends_on:
      db-init:
        condition: service_completed_successfully
      # Don't block API on AI health — small VPS AI boot can take minutes / OOM
      ai-analytics:
        condition: service_started
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoinsight_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 120s

  ai-analytics:
    build:
      context: ./services/ai-analytics-python
      dockerfile: Dockerfile
    image: geoinsight/ai-analytics:local
    container_name: geoinsight-ai-analytics
    restart: unless-stopped
    stop_grace_period: 30s
    # Internal only (ai-analytics:8000) — no host bind avoids Windows Hyper-V port exclusions on 8000
    environment:
      NODE_ENV: production
      AI_CORE_PORT: 8000
      # 1 worker on VPS — 2 workers often OOM / freeze Docker on 4–8GB Hostinger plans
      AI_WORKER_POOL_SIZE: ${AI_WORKER_POOL_SIZE:-1}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-geoinsight_exchange}
      RABBITMQ_AI_QUEUE: ${RABBITMQ_AI_QUEUE:-ai_analytics_queue}
      SENTIMENT_USE_MOCK: ${SENTIMENT_USE_MOCK:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      SOVEREIGN_MODE: ${SOVEREIGN_MODE:-true}
      AI_MODEL_CACHE_DIR: /tmp/ml_models/cache
      CORS_ORIGINS: ${CORS_ORIGIN:-http://localhost:3600},http://api-gateway:4000
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - geoinsight_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Single uvicorn worker — lower RAM, faster healthy on VPS
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/v1/health/ready'')"',
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 1536M

  dashboard-nextjs:
    build:
      context: ./web/dashboard-nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4800/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4800}
    image: geoinsight/dashboard:local
    container_name: geoinsight-dashboard
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${DASHBOARD_PORT:-3600}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      # BFF proxy must use Docker DNS — never the public host IP from inside the container
      API_GATEWAY_URL: ${DASHBOARD_API_GATEWAY_URL:-http://geoinsight-api-gateway:4000}
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      COOKIE_SECURE: "false"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - geoinsight_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
